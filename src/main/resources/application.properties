spring.application.name=scrum-planning-be

# Database Configuration
spring.datasource.url=jdbc:h2:mem:scrum_planning_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.thy.scrum_planning_be=DEBUG
# Renkli ve TraceID iceren log format?
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([TraceID:%X{traceId}]){yellow} %clr(---){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# Server
server.port=8080